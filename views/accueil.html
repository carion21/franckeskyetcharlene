  <section class="ask" aria-labelledby="ask-title">
    <h2 class="ask__title" id="ask-title">
      Comment aimez-vous qu'on vous raconte une histoire ?
    </h2>
    <p class="ask__lede t-verse">
      Votre réponse choisit la façon dont cette page vous racontera le 10 octobre.
      Il n'y a pas de mauvaise réponse — seulement trois manières de dire la même chose.
    </p>

    <!-- Un vrai formulaire : la page fonctionne sans JavaScript, et l'écriture
         du vote passe par un POST plutôt que par un lien qu'un préchargement
         de navigateur rejouerait tout seul. -->
    <form class="choices" method="post" action="/api/landing-choice">
      <button class="choice" type="submit" name="version" value="v1">
        <span class="choice__num t-label">I</span>
        <span class="choice__title">D'un seul souffle</span>
        <span class="choice__sub t-verse">
          Tout s'enchaîne, sans reprendre son air — comme une pellicule qui défile.
        </span>
      </button>

      <button class="choice" type="submit" name="version" value="v2">
        <span class="choice__num t-label">II</span>
        <span class="choice__title">Acte par acte</span>
        <span class="choice__sub t-verse">
          Chaque moment annoncé, à sa place, avec le temps de respirer entre deux.
        </span>
      </button>

      <button class="choice" type="submit" name="version" value="v3">
        <span class="choice__num t-label">III</span>
        <span class="choice__title">En suivant le fil</span>
        <span class="choice__sub t-verse">
          Une seule ligne dorée, du premier mot au dernier, et le récit qui s'y accroche.
        </span>
      </button>
    </form>
